info:
  name: Get Upload URL
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASEURL}}/upload-url?fileName=my-custom-image.png&contentType=image/png"
  params:
    - name: fileName
      value: my-custom-image.png
      type: query
    - name: contentType
      value: image/png
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

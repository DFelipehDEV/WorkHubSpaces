opencollection: 1.0.0

info:
  name: WorkHub Spaces API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{AUTHTOKEN}}"
  variables:
    - name: BASEURL
      value: http://localhost:3000
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{BASEURL}}/"

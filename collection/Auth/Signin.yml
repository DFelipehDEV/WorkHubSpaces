info:
  name: Signin
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASEURL}}/signin"
  body:
    type: json
    data: |-
      {
          "name": "Test User",
          "password": "password123",
          "email": "email@gmail.com",
          "contact": "+351 91623225",
          "address": "Porto",
          "nif": 2345676,
          "activity": "Test",
          "company": "Test Company"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

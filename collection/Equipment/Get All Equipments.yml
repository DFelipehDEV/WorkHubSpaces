info:
  name: Get All Equipments
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASEURL}}/equipments"
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: limit
      value: "5"
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

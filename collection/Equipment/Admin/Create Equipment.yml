info:
  name: Create Equipment
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASEURL}}/equipments"
  body:
    type: json
    data: |-
      {
          "name": "Camara"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Create Space
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASEURL}}/spaces"
  body:
    type: json
    data: |-
      {
          "name": "Espaço Lunar",
          "type": "Lunatico",
          "available": true,
          "description": "",
          "capacity": 120,
          "pricePerHour": 40,
          "images": []
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
